version: '3.9'

# ─────────────────────────────────────────────────────────────────────────────
# high-performance-order-api — Docker Compose
#
# Services:
#   postgres  — PostgreSQL 16 database
#   redis     — Redis 7 (cache + BullMQ)
#   api       — Express HTTP API (compiled JS)
#   worker    — BullMQ notification worker (same image, different CMD)
#
# Usage:
#   docker compose up --build          # build images and start all services
#   docker compose up -d               # start in detached mode
#   docker compose down                # stop and remove containers (data volumes preserved)
#   docker compose down -v             # stop and REMOVE volumes (wipes DB data)
#   docker compose logs -f api         # tail API logs
#   docker compose logs -f worker      # tail worker logs
#   docker compose exec api npm run db:seed   # seed the database
#
# ⚠  PRODUCTION WARNING:
#   The credentials below are LOCAL DEVELOPMENT values only.
#   In production, inject secrets via a secrets manager or CI environment —
#   NEVER commit real credentials.
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: order_api_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: order_api
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # Expose locally for tooling (pgAdmin, Prisma Studio).
      # Remove this port mapping in production to keep the DB internal.
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d order_api']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: order_api_redis
    restart: unless-stopped
    ports:
      # Expose locally for inspection (redis-cli, RedisInsight).
      # Remove in production for a purely internal network.
      - '6379:6379'
    volumes:
      # Redis persistence: RDB snapshot every 60s if at least 1 key changed.
      # Used by: cache, rate-limiting, BullMQ.
      # Without persistence, BullMQ jobs would be lost on Redis restart.
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ── API Server ───────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: high-performance-order-api:latest
    container_name: order_api_server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      # ── Database ─────────────────────────────────────────────────────────────
      # Uses 'postgres' (Compose service name) for inter-container DNS.
      # localhost:5432 would point to the container itself — NOT the DB service.
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/order_api
      # ── Redis ─────────────────────────────────────────────────────────────────
      REDIS_URL: redis://redis:6379
      CACHE_TTL_SECONDS: '300'
      # ── Queue / Worker ────────────────────────────────────────────────────────
      QUEUE_PREFIX: high-performance-order-api
      WORKER_CONCURRENCY: '5'
      # ── JWT — CHANGE THESE in production ─────────────────────────────────────
      JWT_SECRET: change-me-in-production
      JWT_ACCESS_SECRET: change-me-access-secret-min-32-chars-prod
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: change-me-refresh-secret-min-32-chars-prod
      JWT_REFRESH_EXPIRES_IN: 7d
      # ── Business logic ────────────────────────────────────────────────────────
      STOCK_RESERVATION_MINUTES: '30'
      IDEMPOTENCY_KEY_TTL_HOURS: '24'
      TIMEZONE: UTC
      PRISMA_LOG_QUERIES: 'false'
      # ── Rate limiting ─────────────────────────────────────────────────────────
      RATE_LIMIT_WINDOW_MS: '60000'
      RATE_LIMIT_MAX_REQUESTS: '100'
      AUTH_RATE_LIMIT_WINDOW_MS: '60000'
      AUTH_RATE_LIMIT_MAX_REQUESTS: '10'
      ORDER_RATE_LIMIT_WINDOW_MS: '60000'
      ORDER_RATE_LIMIT_MAX_REQUESTS: '20'
      # ── CORS ──────────────────────────────────────────────────────────────────
      CORS_ORIGINS: 'http://localhost:3000'
      BODY_LIMIT: 1mb
    ports:
      - '5000:5000'
    # Run DB migration on startup, then launch the API.
    # prisma migrate deploy is idempotent and safe for production:
    #   - applies pending migrations
    #   - never resets or recreates the database
    command: >
      sh -c "npx prisma migrate deploy && node dist/server.js"
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:5000/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── BullMQ Worker ────────────────────────────────────────────────────────────
  worker:
    image: high-performance-order-api:latest
    container_name: order_api_worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/order_api
      REDIS_URL: redis://redis:6379
      CACHE_TTL_SECONDS: '300'
      QUEUE_PREFIX: high-performance-order-api
      WORKER_CONCURRENCY: '5'
      JWT_SECRET: change-me-in-production
      JWT_ACCESS_SECRET: change-me-access-secret-min-32-chars-prod
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: change-me-refresh-secret-min-32-chars-prod
      JWT_REFRESH_EXPIRES_IN: 7d
      STOCK_RESERVATION_MINUTES: '30'
      IDEMPOTENCY_KEY_TTL_HOURS: '24'
      TIMEZONE: UTC
      PRISMA_LOG_QUERIES: 'false'
      RATE_LIMIT_WINDOW_MS: '60000'
      RATE_LIMIT_MAX_REQUESTS: '100'
      AUTH_RATE_LIMIT_WINDOW_MS: '60000'
      AUTH_RATE_LIMIT_MAX_REQUESTS: '10'
      ORDER_RATE_LIMIT_WINDOW_MS: '60000'
      ORDER_RATE_LIMIT_MAX_REQUESTS: '20'
      CORS_ORIGINS: 'http://localhost:3000'
      BODY_LIMIT: 1mb
    # Worker does NOT expose any HTTP port — it is a background process only
    command: node dist/worker.js

# ── Named volumes ────────────────────────────────────────────────────────────
# Data survives container recreation. Use `docker compose down -v` to wipe.
volumes:
  postgres_data:
  redis_data:
